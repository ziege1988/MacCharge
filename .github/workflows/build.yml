name: Build & Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version bestimmen
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: App bauen
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-app.sh "${{ steps.ver.outputs.version }}"

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: MacCharge-${{ steps.ver.outputs.version }}
          path: dist/MacCharge-*.zip

      - name: Smoke-Test mit Screenshots
        if: "!startsWith(github.ref, 'refs/tags/v')"
        continue-on-error: true
        run: |
          mkdir -p shots
          DOM=io.github.ziege1988.maccharge
          W=$(osascript -l JavaScript -e 'ObjC.import("AppKit"); $.NSScreen.mainScreen.frame.size.width')
          W=${W%.*}
          X=$(( W - 360 ))
          BX=$(( W / 2 - 520 ))
          defaults write $DOM warnDelay -float 2
          # 1) Hochformat, normaler Betrieb
          open --env MACCHARGE_DEMO=1 dist/MacCharge.app
          sleep 1.2 && screencapture -x -R "$X,0,360,600" shots/1-splash.png
          sleep 30 && screencapture -x -R "$X,0,360,600" shots/2-dashboard.png
          pgrep -x MacCharge && echo "App läuft"
          pkill -x MacCharge || true; sleep 1
          # 2) Hochformat, Akku kritisch
          open --env MACCHARGE_DEMO=low dist/MacCharge.app
          sleep 6 && screencapture -x -R "$X,0,360,600" shots/3-akku-kritisch.png
          pkill -x MacCharge || true; sleep 1
          # 3) Leiste
          defaults write $DOM layout bar
          open --env MACCHARGE_DEMO=1 dist/MacCharge.app
          sleep 1.2 && screencapture -x -R "$BX,0,1040,100" shots/4-leiste-splash.png
          sleep 30 && screencapture -x -R "$BX,0,1040,100" shots/5-leiste.png
          pkill -x MacCharge || true; sleep 1
          open --env MACCHARGE_DEMO=low dist/MacCharge.app
          sleep 6 && screencapture -x -R "$BX,0,1040,100" shots/6-leiste-kritisch.png
          pkill -x MacCharge || true
          for f in shots/*.png; do echo "BEGIN64 $f"; base64 -i "$f"; echo "END64"; done

      - name: Screenshots hochladen
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore

      - name: Neue Version auf main?
        id: rel
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v${{ steps.ver.outputs.version }} existiert bereits – nichts zu tun."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      # Release entsteht automatisch: per Tag v* ODER wenn auf main eine neue Version in VERSION steht.
      - name: GitHub Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v') || steps.rel.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MacCharge ${{ steps.ver.outputs.version }}
          files: dist/MacCharge-*.zip
          generate_release_notes: true
