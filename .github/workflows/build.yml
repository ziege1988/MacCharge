name: Build & Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version bestimmen
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: App bauen
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-app.sh "${{ steps.ver.outputs.version }}"

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: MacCharge-${{ steps.ver.outputs.version }}
          path: dist/MacCharge-*.zip

      - name: Smoke-Test mit Screenshots
        if: "!startsWith(github.ref, 'refs/tags/v')"
        continue-on-error: true
        run: |
          mkdir -p shots
          W=$(osascript -l JavaScript -e 'ObjC.import("AppKit"); $.NSScreen.mainScreen.frame.size.width')
          X=$(( ${W%.*} - 360 ))
          defaults write io.github.ziege1988.maccharge warnDelay -float 2
          open --env MACCHARGE_DEMO=1 dist/MacCharge.app
          sleep 1.2 && screencapture -x -R "$X,0,360,560" shots/1-splash.png
          sleep 16 && screencapture -x -R "$X,0,360,560" shots/2-dashboard.png
          pgrep -x MacCharge && echo "App läuft"
          pkill -x MacCharge || true
          sleep 1
          open --env MACCHARGE_DEMO=low dist/MacCharge.app
          sleep 6 && screencapture -x -R "$X,0,360,560" shots/3-akku-kritisch.png
          sleep 0.55 && screencapture -x -R "$X,0,360,560" shots/4-akku-kritisch-blink.png
          pkill -x MacCharge || true
          for f in shots/*.png; do echo "BEGIN64 $f"; base64 -i "$f"; echo "END64"; done

      - name: Screenshots hochladen
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore

      - name: GitHub Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MacCharge-*.zip
          generate_release_notes: true
